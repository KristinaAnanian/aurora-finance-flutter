name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, aurora-flutter-v0-2]

permissions:
  contents: read

jobs:
  android-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name aurora_finance --org com.aurorafinance

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart and Flutter code
        run: flutter analyze

      - name: Run app tests
        run: flutter test

      - name: Build APK (release, test signing)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-finance-v0-2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
